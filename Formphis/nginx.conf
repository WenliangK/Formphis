server {
    listen 80;
    server_name _;

    # Esta es la línea exacta que usábamos antes y que funcionaba
    add_header bypass-tunnel-reminder "true" always;

    root /var/www/html;
    index index.html index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        add_header bypass-tunnel-reminder "true" always;
        fastcgi_pass php:9000;
        fastcgi_index proceso.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}