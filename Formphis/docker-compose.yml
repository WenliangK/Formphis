version: '3.8'

services:
  web:
    image: nginx:alpine
    ports:
      - "0.0.0.0:8000:80"
    volumes:
      - /home/kung/startup-forms/html:/var/www/html:z
      - /home/kung/startup-forms/nginx.conf:/etc/nginx/conf.d/default.conf:z
    depends_on:
      - php

  php:
    image: php:8.2-fpm-alpine
    volumes:
      - /home/kung/startup-forms/html:/var/www/html:z